# Pipeline test episode (neutral content): every layer type, transitions, per-format overrides, captions, music.
title: Demo Episode 01
audio:
  music: {src: ../assets/pad.wav, gain_db: -10, duck_db: -8, fade_in: 1.0, fade_out: 2.0}
dialogue:
  - {who: narrator, at: 1.2, dur: 3.2, text: "Every city keeps a secret in the hour before dawn."}
  - {who: narrator, at: 7.5, dur: 3.0, text: "Most people sleep straight through it."}
  - {who: narrator, at: 14.0, dur: 3.5, text: "But the light arrives the same way every time."}
  - {who: narrator, at: 25.0, dur: 3.0, text: "Slow at first. Then all at once."}
  - {who: narrator, at: 37.0, dur: 3.2, text: "Watch the edges. That is where it starts."}
  - {who: narrator, at: 49.0, dur: 3.5, text: "Tomorrow, look up. You will see it too."}
shots:
  - id: cold_open
    dur: 6
    layers:
      - {type: image, src: ../assets/plate_city_2001.png, zoom: [[0, 1.0], [6, 1.12]], focus: [[0, [0.5, 0.55]], [6, [0.45, 0.5]]],
         short: {focus: [[0, [0.62, 0.55]], [6, [0.55, 0.5]]]}}
      - {type: text, text: "THE HOUR BEFORE DAWN", font: title, size: 0.075, y: 0.42, at: 0.6, until: 4.8, anim: slide,
         stroke: 0.04, short: {y: 0.35, size: 0.085, x: 0.47, max_w: 0.74}}
  - id: city_wide
    dur: 6
    transition: {type: fade, dur: 0.8}
    layers:
      - {type: image, src: ../assets/plate_deck_2002.png, zoom: [[0, 1.15], [6, 1.0]], focus: [0.5, 0.5]}
  - id: fractal
    dur: 6
    transition: {type: dip, dur: 0.6}
    layers:
      - {type: video, src: ../assets/fractal.mp4, fit: cover, zoom: [[0, 1.0], [6, 1.25]], tint: '#4aa0ff', tint_amount: 0.4}
      - {type: text, text: "light travels", font: body, size: 0.05, y: 0.15, at: 1.0, until: 5.0, anim: type, short: {y: 0.2}}
  - id: dawn_1
    dur: 6
    transition: {type: fade, dur: 1.0}
    layers:
      - {type: image, src: ../assets/plate_dawn_2000.png, zoom: [[0, 1.05], [6, 1.2]], focus: [[0, [0.4, 0.5]], [6, [0.6, 0.45]]]}
  - id: impact
    dur: 6
    transition: {type: flash, dur: 0.3}
    camera: {shake: [[0, 0.012], [1.2, 0.0]], zoom: [[0, 1.08], [6, 1.0]]}
    flash: [[0.0, 0.8], [2.4, 0.5]]
    layers:
      - {type: gradient, top: '#0b1220', bottom: '#000000', glow: '#ff9a4a', glow_at: [[0, [0.5, 0.7]], [6, [0.5, 0.45]]], glow_size: 0.45}
      - {type: text, text: "ALL AT ONCE!", font: title, size: 0.14, y: 0.5, at: 0.15, until: 5.6, anim: pop, stroke: 0.05}
  - id: edges
    dur: 6
    transition: {type: fade, dur: 0.6}
    layers:
      - {type: image, src: ../assets/plate_dawn_2002.png, zoom: [[0, 1.0], [6, 1.15]], focus: [0.5, 0.4], short: {focus: [0.35, 0.4]}}
  - id: city_return
    dur: 6
    transition: {type: dip_white, dur: 0.6}
    layers:
      - {type: image, src: ../assets/plate_city_2001.png, zoom: [[0, 1.2], [6, 1.3]], focus: [0.6, 0.5]}
  - id: fractal_2
    dur: 6
    transition: {type: fade, dur: 0.8}
    layers:
      - {type: video, src: ../assets/fractal.mp4, fit: cover, speed: 0.5, zoom: 1.4, focus: [0.4, 0.5], tint: '#ffb070', tint_amount: 0.5}
  - id: dawn_2
    dur: 6
    transition: {type: fade, dur: 1.0}
    layers:
      - {type: image, src: ../assets/plate_dawn_2000.png, zoom: [[0, 1.3], [6, 1.0]], focus: [0.55, 0.5]}
  - id: end_card
    dur: 6
    transition: {type: dip, dur: 0.8}
    allow_black: true
    layers:
      - {type: gradient, top: '#050608', bottom: '#000000'}
      - {type: text, text: "SUBSCRIBE FOR EPISODE 02", font: title, size: 0.06, y: 0.5, at: 0.5, until: 5.5, anim: fade,
         short: {size: 0.07, max_w: 0.8}}
